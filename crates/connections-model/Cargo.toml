[package]
name = "nocterm-connections-model"
description = "Pure connection formats, drafts, checked transitions and native capability ports."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "domain"

[dependencies]
nocterm-session.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
thiserror.workspace = true

[features]
test-support = []

[dev-dependencies]
nocterm-session = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
