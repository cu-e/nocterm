[package]
name = "nocterm-plugin-sdk"
description = "The guest SDK for Rust code plugins: the Plugin trait, a view builder, typed reads, effect constructors, the export! macro and a native test host."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "domain"

# The crate is `no_std` with `alloc` (a guest links it), so these do not take the workspace
# entries, which keep the default `std` features. The feature `testing` adds `std` and the TOML
# parser the native test host reads a manifest with.
[features]
testing = ["dep:toml"]

[dependencies]
nocterm-plugin-abi.workspace = true
nocterm-plugin-api.workspace = true
nocterm-plugin-model.workspace = true
thiserror = { version = "2", default-features = false }
toml = { workspace = true, optional = true }

[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
