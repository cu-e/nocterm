[package]
name = "nocterm-terminal"
description = "Terminal tab: renders a session's grid and drives its prompts."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-terminal-model.workspace = true

encoding_rs.workspace = true
regex.workspace = true
nocterm-session.workspace = true
nocterm-settings.workspace = true
nocterm-store.workspace = true
nocterm-ui.workspace = true
nocterm-vt.workspace = true
nocterm-workspace.workspace = true

gpui-kit.workspace = true
tracing.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
nocterm-theme-service.workspace = true
nocterm-themes.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
futures.workspace = true
nocterm-session = { workspace = true, features = ["test-support"] }
