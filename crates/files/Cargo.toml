[package]
name = "nocterm-files"
description = "Local and remote Explorer with streaming file transfers."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-explorer.workspace = true
thiserror.workspace = true
nocterm-plugin-model.workspace = true
nocterm-session.workspace = true
nocterm-store.workspace = true
nocterm-transfers.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
nocterm-plugin-api = { workspace = true, optional = true }
nocterm-plugin-ports = { workspace = true, optional = true }
futures.workspace = true
gpui-kit.workspace = true
parking_lot.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[features]
# The transfer counts, offered to user plugins that were granted `transfers.counts`.
user-plugins = ["dep:nocterm-plugin-api", "dep:nocterm-plugin-ports"]

[dev-dependencies]
nocterm-explorer = { workspace = true, features = ["test-support"] }
nocterm-project-model.workspace = true
nocterm-settings.workspace = true
nocterm-workspace = { workspace = true, features = ["test-support"] }
nocterm-transfers = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
