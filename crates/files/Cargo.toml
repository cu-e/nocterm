[package]
name = "nocterm-files"
description = "Local and remote Explorer with streaming file transfers."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-session.workspace = true
nocterm-transfers.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
futures.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
directories.workspace = true
parking_lot.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
nix = { version = "0.28", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
