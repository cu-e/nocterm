[package]
name = "nocterm-files"
description = "Local and remote Explorer with streaming file transfers."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
thiserror.workspace = true
schemars.workspace = true
serde.workspace = true
nocterm-session.workspace = true
nocterm-settings.workspace = true
nocterm-transfers.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
futures.workspace = true
gpui-kit.workspace = true
parking_lot.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
nocterm-transfers = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
