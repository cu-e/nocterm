[package]
name = "nocterm-agent"
description = "ACP chat panel, threads and terminal context."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-ai.workspace = true
nocterm-project-model.workspace = true
nocterm-agent-chat.workspace = true
nocterm-agent-runtime.workspace = true
nocterm-agent-directory.workspace = true
nocterm-store.workspace = true
nocterm-session.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
# Fenced code in chat replies: the languages agents write most.
gpui-kit = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
futures.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
nocterm-workspace-ports.workspace = true
nocterm-workspace = { workspace = true, features = ["test-support"] }
nocterm-project-model = { workspace = true, features = ["test-support"] }
nocterm-agent-chat = { workspace = true, features = ["test-support"] }
nocterm-agent-providers.workspace = true
nocterm-session = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
nocterm-ai = { workspace = true, features = ["test-support"] }
nocterm-agent-runtime = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
