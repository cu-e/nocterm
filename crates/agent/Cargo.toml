[package]
name = "nocterm-agent"
description = "ACP agent runtime, chat panel and terminal context."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-ai.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
nocterm-core.workspace = true
nocterm-settings.workspace = true
gpui-kit.workspace = true
futures.workspace = true
async-channel.workspace = true
serde_json.workspace = true
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tracing.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
