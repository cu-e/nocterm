[package]
name = "nocterm-plugin-host"
description = "The user plugin host: grants, effect broker, rate limits, cadence and caps, plugin records and plugin data."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "service"

[features]
# In-memory records, data and packages for tests of the host and of the app's adapters.
test-support = []

[dependencies]
nocterm-plugin-api.workspace = true
nocterm-plugin-model.workspace = true
nocterm-plugin-ports.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
nocterm-plugin-ports = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
