[package]
name = "nocterm-plugin-api"
description = "The user plugin contract: capability table, snapshot, view and effect data, manifests, grants and the declarative template interpreter."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "domain"

[features]
# Constructors that only tests of the host may use, such as a manifest context that lists effect
# capabilities for a stand-in runtime. Enabled by dev-dependencies only (checked by xtask).
test-support = []

# The crate is `no_std` with `alloc`, so these do not take the workspace entries (which keep
# the default `std` features); the isolation check lists the direct dependencies.
[dependencies]
nocterm-plugin-model.workspace = true
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
