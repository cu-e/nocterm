[package]
name = "nocterm-runner"
description = "Independent persistent Cloud runner control plane."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "app"

[dependencies]
nocterm-agent-engine.workspace = true
nocterm-agent-tools.workspace = true
nocterm-session.workspace = true
nocterm-local.workspace = true
nocterm-ssh.workspace = true
nocterm-ssh-keys.workspace = true
futures.workspace = true
nocterm-core.workspace = true
nocterm-hubs-model.workspace = true
nocterm-cloud-model.workspace = true
nocterm-hub-io.workspace = true
nocterm-hub-model.workspace = true
nocterm-cloud-runner.workspace = true
tokio = { workspace = true, features = ["signal"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
nocterm-session = { workspace = true, features = ["test-support"] }
nocterm-cloud-model = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
