[package]
name = "nocterm-device-unlock"
description = "Native authenticated vault key release for Linux, macOS and Windows."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false
[package.metadata.nocterm]
layer = "adapter"
[dependencies]
nocterm-vault.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio.workspace = true
nix = { version = "0.31", features = ["user"] }
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }
tid-rs = "0.1.1"
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials", "Security_Credentials_UI", "Security_Cryptography", "Storage_Streams", "Foundation"] }
windows-future = "0.3"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305.workspace = true
[lints]
workspace = true
