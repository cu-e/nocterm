[package]
name = "nocterm-hubs"
description = "The hubs this device knows: connection status shared by every window, and sign-in."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "service"

[dependencies]
nocterm-hubs-model.workspace = true
nocterm-session.workspace = true
nocterm-store.workspace = true

gpui.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
nocterm-hubs-model = { workspace = true, features = ["test-support"] }
nocterm-core.workspace = true
nocterm-settings.workspace = true
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
