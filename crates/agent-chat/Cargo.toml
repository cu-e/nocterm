[package]
name = "nocterm-agent-chat"
description = "Agent chats, their sessions, tools and lifecycle, without views."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "service"

[features]
# Inspection and driving helpers for tests of crates that host chats.
test-support = []

[dependencies]
gpui.workspace = true
nocterm-ai.workspace = true
nocterm-agent-runtime.workspace = true
nocterm-agent-directory.workspace = true
nocterm-store.workspace = true
nocterm-session.workspace = true
nocterm-workspace-ports.workspace = true
futures.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
nocterm-ai = { workspace = true, features = ["test-support"] }
nocterm-agent-runtime = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
