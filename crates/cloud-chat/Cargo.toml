[package]
name = "nocterm-cloud-chat"
description = "The desktop's Cloud chat entity over the conversation port: transcript, freshness and pending prompts."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "service"

[dependencies]
nocterm-core.workspace = true
nocterm-ai.workspace = true
nocterm-cloud-conversation-model.workspace = true
nocterm-agent-runtime.workspace = true
nocterm-agent-chat.workspace = true
gpui.workspace = true
futures.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
nocterm-cloud-conversation-model = { workspace = true, features = ["test-support"] }
nocterm-agent-runtime = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
