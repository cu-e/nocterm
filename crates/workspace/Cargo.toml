[package]
name = "nocterm-workspace"
description = "Window shell: tab strip, sidebar and the registries features plug into."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "ui"

[dependencies]
nocterm-core.workspace = true
nocterm-store.workspace = true
nocterm-settings.workspace = true
nocterm-session.workspace = true
nocterm-workspace-ports.workspace = true
nocterm-ui.workspace = true
nocterm-keymap.workspace = true
nocterm-project-model.workspace = true
nocterm-plugin-model.workspace = true
nocterm-plugin-enablement.workspace = true
nocterm-window-layout.workspace = true
nocterm-plugin-api = { workspace = true, optional = true }
nocterm-plugin-ports = { workspace = true, optional = true }

gpui-kit.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
schemars.workspace = true

[features]
test-support = []
# Providers of what a user plugin may observe (docs/architecture/guardrails.md).
user-plugins = ["dep:nocterm-plugin-api", "dep:nocterm-plugin-ports"]

[lints]
workspace = true

[dev-dependencies]
nocterm-core = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
toml.workspace = true
