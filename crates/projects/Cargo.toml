[package]
name = "nocterm-projects"
description = "Connection-bound workspace library, creation and nested terminal presentation."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
gpui-kit.workspace = true
nocterm-project-model.workspace = true
nocterm-project-service.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
nocterm-workspace-ports.workspace = true
thiserror.workspace = true

[dev-dependencies]
nocterm-session = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
nocterm-project-model = { workspace = true, features = ["test-support"] }
nocterm-workspace = { workspace = true, features = ["test-support"] }
nocterm-workspace-ports = { workspace = true, features = ["test-support"] }
nocterm-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
