[package]
name = "nocterm-acp"
description = "ACP subprocess adapter and authenticated terminal bridge."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-ai.workspace = true
nocterm-core.workspace = true
agent-client-protocol.workspace = true
async-process.workspace = true
async-io.workspace = true
async-channel.workspace = true
futures.workspace = true
serde_json.workspace = true
getrandom.workspace = true
subtle = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["process", "event"] }

[dev-dependencies]
tempfile.workspace = true
nocterm-settings.workspace = true

[lints]
workspace = true
