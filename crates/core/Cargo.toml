description = "Shared kernel: standard file locations and atomic, comment-preserving TOML persistence."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "foundation"

[dependencies]
directories.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["user"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
