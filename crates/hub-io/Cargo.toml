[package]
name = "nocterm-hub-io"
description = "Reaches Nocterm hubs through the hub contract: pinned TLS, device credentials, sign-in and session lists."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-core.workspace = true
nocterm-hubs-model.workspace = true
nocterm-session.workspace = true
nocterm-hub-client.workspace = true
nocterm-hub-proto.workspace = true
nocterm-keys.workspace = true
nocterm-connections-model.workspace = true
nocterm-vault.workspace = true

base64.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
tonic.workspace = true
nocterm-hubs-model = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
nocterm-connections-model = { workspace = true, features = ["test-support"] }
# The live tests keep an SSH key in an account and sign in to a real sshd with it.
nocterm-ssh.workspace = true
nocterm-ssh-keys.workspace = true

[lints]
workspace = true
