[package]
name = "nocterm-monitor-ui"
description = "The active host's resources in the status bar, with details and graphs."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-monitor.workspace = true
nocterm-plugin-model.workspace = true
nocterm-project-model.workspace = true
nocterm-project-providers.workspace = true
nocterm-session.workspace = true
nocterm-store.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
gpui-kit.workspace = true

[lints]
workspace = true

[dev-dependencies]
nocterm-containers.workspace = true
serde_json.workspace = true
nocterm-workspace = { workspace = true, features = ["test-support"] }
nocterm-session = { workspace = true, features = ["test-support"] }
nocterm-settings.workspace = true
tempfile.workspace = true
toml.workspace = true
futures.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
