[package]
name = "nocterm-plugin-abi"
description = "The guest ABI of code plugins: export names, call and reply wire types and their postcard encoding."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "domain"

# The crate is `no_std` with `alloc` (a guest links it too), so these do not take the workspace
# entries, which keep the default `std` features; the isolation check lists the direct
# dependencies.
[dependencies]
nocterm-plugin-api.workspace = true
nocterm-plugin-model.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[lints]
workspace = true
