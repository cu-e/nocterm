[package]
name = "nocterm-project-storage"
description = "Private bounded project catalog storage and native project metadata."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-project-model.workspace = true
nocterm-core.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
nocterm-project-model = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
