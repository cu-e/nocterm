[package]
name = "nocterm-cloud-runner"
description = "Durable headless Cloud run journal and native coordination."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-ai.workspace = true
serde_json.workspace = true
tokio.workspace = true
nocterm-cloud-model.workspace = true
nocterm-core.workspace = true
futures.workspace = true
parking_lot.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "limits"] }
serde.workspace = true
sha2 = "0.11"
zeroize.workspace = true

[dev-dependencies]
nocterm-cloud-model = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
