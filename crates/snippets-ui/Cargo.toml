[package]
name = "nocterm-snippets-ui"
description = "Contextual snippet panel and highlighted code editor."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "feature"

[dependencies]
nocterm-snippets.workspace = true
nocterm-core.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true
futures.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-bash", "tree-sitter-python", "tree-sitter-yaml", "tree-sitter-toml"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }
