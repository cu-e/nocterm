[package]
name = "nocterm-local"
description = "Portable local PTY session and program adapter."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-session.workspace = true
portable-pty.workspace = true
async-channel.workspace = true
futures.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "fs", "event"] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1.0", default-features = false, features = ["std", "job-object", "creation-flags"] }

[lints]
workspace = true
