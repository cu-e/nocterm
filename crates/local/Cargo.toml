[package]
name = "nocterm-local"
description = "Portable local PTY session adapter."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "adapter"

[dependencies]
nocterm-session.workspace = true
portable-pty.workspace = true
async-channel.workspace = true
futures.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["signal", "fs"] }

[lints]
workspace = true
