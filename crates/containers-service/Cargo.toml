[package]
name = "nocterm-containers-service"
description = "One shared watch of each host's containers and images, relisted only for events that change them."
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "service"

[dependencies]
gpui.workspace = true
nocterm-containers.workspace = true
nocterm-session.workspace = true
futures.workspace = true

[features]
test-support = []

[lints]
workspace = true

[dev-dependencies]
nocterm-session = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
