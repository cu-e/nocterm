# Explicit plain-data exemptions only. Stateful entities are never DTOs.
[dto]
"nocterm_agent::AgentServices" = "Composition dependencies, copied into constructors."
"nocterm_agent_runtime::RuntimeServices" = "Composition dependencies, copied into constructors."
"nocterm_agent_runtime::TerminalAuthRequest" = "Authentication request passed to a feature through the runtime event."
"nocterm_connections::os::Os" = "Detected operating-system facts value."
"nocterm_files::local::LocalEntry" = "Filesystem listing row returned by the adapter."
"nocterm_explorer::settings::ExplorerSettings" = "Serialized settings section."
"nocterm_explorer::settings::IndexingSettings" = "Serialized settings values."
"nocterm_explorer::settings::OpenRule" = "Serialized opener rule."
"nocterm_explorer::settings::OpenSettings" = "Serialized opener settings."
"nocterm_explorer::settings::Opener" = "Serialized opener description."
"nocterm_monitor::settings::MonitorSettings" = "Serialized settings section."
"nocterm_vault::settings::VaultSettings" = "Serialized settings section."
"nocterm_workspace_ports::connections::ConnectionSummary" = "Saved connection facts listed to consumers."
"nocterm_workspace_ports::session::SessionContext" = "Remote session facts behind a tab."
"nocterm_workspace_ports::terminal::FactSessionSnapshot" = "Connection-facts source and its identity, copied by value."
"nocterm_workspace_ports::terminal::SignInPrompt" = "Sign-in prompt facts read from a terminal."
"nocterm_workspace_ports::terminal::TerminalEntry" = "Terminal identity, label and capability handles listed by the workspace."
"nocterm_workspace_ports::terminal::TerminalInfo" = "Terminal state facts returned by a terminal port."
"nocterm_workspace_ports::terminal::TerminalText" = "Text read from a terminal and its bounds."
"nocterm_workspace_ports::terminal::TextRequest" = "Bounds of a terminal text read."

# Isolation of the plugin crates (docs/architecture/guardrails.md, ADR 0089). A row applies as
# soon as its package exists. Every list is closed: a new crate, dependency or exemption is a
# reviewed edit of this file, with a reason where a table asks for one.
[isolation]
# Vendored GUI library package: the closure of a `gpui` row may also hold its closure.
gpui = "gpui-pre"
# Package whose default-feature closure must not contain a user-plugin-only crate.
app = "nocterm"

# Named lists of external crates (package names) that a row may reach transitively.
[isolation.external]
base = [
    "proc-macro2",
    "quote",
    "serde",
    "serde_core",
    "serde_derive",
    "syn",
    "thiserror",
    "thiserror-impl",
    "unicode-ident",
]
# The closure of nocterm-core as `cargo metadata` resolves it for every target (59 crates).
core = [
    "bitflags",
    "bumpalo",
    "cfg-if",
    "cfg_aliases",
    "directories",
    "dirs-sys",
    "equivalent",
    "errno",
    "fastrand",
    "futures",
    "futures-channel",
    "futures-core",
    "futures-executor",
    "futures-io",
    "futures-macro",
    "futures-sink",
    "futures-task",
    "futures-util",
    "getrandom",
    "hashbrown",
    "indexmap",
    "js-sys",
    "libc",
    "libredox",
    "linux-raw-sys",
    "memchr",
    "nix",
    "once_cell",
    "option-ext",
    "pin-project-lite",
    "r-efi",
    "rand_core",
    "redox_users",
    "rustix",
    "rustversion",
    "serde_spanned",
    "slab",
    "tempfile",
    "toml",
    "toml_datetime",
    "toml_edit",
    "toml_parser",
    "toml_writer",
    "wasm-bindgen",
    "wasm-bindgen-macro",
    "wasm-bindgen-macro-support",
    "wasm-bindgen-shared",
    "windows-link",
    "windows-sys",
    "winnow",
]
sha2 = [
    "block-buffer",
    "cpufeatures",
    "crypto-common",
    "digest",
    "generic-array",
    "sha2",
    "subtle",
    "typenum",
    "version_check",
]

# Crates inside a list that offer file-system, process or operating-system access. A crate can
# name only its direct dependencies, and no isolated row lists these directly: they are linked
# only through nocterm-core's reviewed `fs` helpers.
[isolation.reviewed]
nix = "Reached through nocterm-core (feature user); not a direct dependency of any row."
rustix = "Reached through tempfile in nocterm-core's atomic publication; not a direct dependency."
linux-raw-sys = "Dependency of rustix."
errno = "Dependency of rustix."
libc = "Reached through nocterm-core and directories; not a direct dependency."
libredox = "Reached through directories on Redox; not a direct dependency."
redox_users = "Reached through directories on Redox; not a direct dependency."
windows-sys = "Reached through nocterm-core on Windows; not a direct dependency."

# One row per isolated package. `kind`: no-std (domain, no std, I2), std (I2b applies) or gpui
# (std plus the gpui receiver rule I3). `closure` is the full transitive nocterm-* closure,
# `direct` the direct external dependencies and `external` the lists above that bound the
# external closure.
[isolation.crates.nocterm-plugin-model]
kind = "no-std"
closure = []
direct = ["serde", "thiserror"]
external = ["base"]

[isolation.crates.nocterm-plugin-api]
kind = "no-std"
closure = ["nocterm-plugin-model"]
direct = ["serde", "thiserror"]
external = ["base"]

[isolation.crates.nocterm-plugin-packages]
kind = "std"
closure = ["nocterm-plugin-api", "nocterm-plugin-model", "nocterm-core"]
direct = ["sha2", "toml"]
external = ["base", "core", "sha2"]

[isolation.crates.nocterm-plugin-ports]
kind = "gpui"
closure = ["nocterm-plugin-api", "nocterm-plugin-model"]
direct = ["gpui-pre"]
external = ["base"]

[isolation.crates.nocterm-plugin-view]
kind = "gpui"
closure = ["nocterm-plugin-api", "nocterm-plugin-model"]
direct = ["gpui-pre"]
external = ["base"]

[isolation.crates.nocterm-plugin-host]
kind = "gpui"
closure = ["nocterm-plugin-ports", "nocterm-plugin-api", "nocterm-plugin-model"]
direct = ["futures", "gpui-pre", "serde", "serde_json", "thiserror", "tracing"]
external = ["base"]

# Modules (or whole packages) that may reach file-system, process, environment or dependency
# I/O paths (I2b), each with a reason. Keys are module paths (`nocterm_plugin_packages::store`)
# or package crate names (`nocterm_plugin_packages`).
[isolation.io_exceptions]
nocterm_plugin_packages = "Bounded file I/O is the adapter's job: nocterm_core::fs calls plus std::fs metadata and removal under the package root (design review row 17)."

# Method names of the gpui receiver types (App, Window, Context, AsyncApp, AsyncWindowContext)
# that gpui crates may name (I3), each with a reason. The list starts empty and grows per PR.
[isolation.gpui_allowed]

[isolation.providers]
# Direct dependents of nocterm-plugin-ports (I5).
allowed = [
    "nocterm",
    "nocterm-files",
    "nocterm-monitor-ui",
    "nocterm-plugin-host",
    "nocterm-ui",
    "nocterm-workspace",
]

# User-plugin-only crates, absent from the default-feature closure of the app (section 5.13).
[isolation.compile_out]
crates = [
    "nocterm-plugin-api",
    "nocterm-plugin-host",
    "nocterm-plugin-packages",
    "nocterm-plugin-ports",
    "nocterm-plugin-view",
]
# Packages whose resolved features must not hold the named feature in the default build.
features = { nocterm-plugins-ui = "user" }
# Features that only tests may enable; checked on the normal closure with `cargo tree`.
test_features = { nocterm-plugin-api = "test-support" }

# M7: user settings never reach the system settings store (identifiers per package).
[isolation.identifiers.nocterm-plugins-ui]
forbidden = ["SettingsHandle", "SettingsPageContext", "contextual", "settings"]
