# Default key bindings.
#
# Each section binds keystrokes to actions inside one key context: the view
# that has focus, or any view around it. Actions are named
# `<namespace>::<Action>`; `docs/reference/actions.md` lists them all.
#
# `os` limits a section to some platforms ("linux", "macos", "windows");
# without it the section applies everywhere.

# ── Workspace ───────────────────────────────────────────────────────────────

[[section]]
context = "Workspace"
os = ["linux", "windows"]

[section.bindings]
"ctrl-shift-t" = "workspace::NewTab"
"ctrl-shift-p" = "workspace::ToggleCommandPalette"
"ctrl-shift-w" = "workspace::CloseTab"
"ctrl-tab" = "workspace::NextTab"
"ctrl-shift-tab" = "workspace::PreviousTab"
"ctrl-pagedown" = "workspace::NextTab"
"ctrl-pageup" = "workspace::PreviousTab"
"ctrl-shift-b" = "workspace::ToggleSidebar"
"ctrl-shift-e" = "files::ToggleExplorer"
"ctrl-shift-c" = "connections::ToggleServers"
"ctrl-e" = "workspace::SwapSides"
"ctrl-," = "workspace::OpenSettings"
"ctrl-shift-q" = "workspace::Quit"
"ctrl-shift-n" = "connections::NewConnection"
"ctrl-alt-left" = "workspace::MoveTabLeft"
"ctrl-alt-right" = "workspace::MoveTabRight"
"ctrl-alt-shift-left" = "workspace::SplitLeft"
"ctrl-alt-shift-right" = "workspace::SplitRight"
"ctrl-alt-shift-up" = "workspace::SplitUp"
"ctrl-alt-shift-down" = "workspace::SplitDown"
"ctrl-alt-pagedown" = "workspace::NextPane"
"ctrl-alt-pageup" = "workspace::PreviousPane"
"ctrl-shift-f2" = "workspace::RenameTab"
"ctrl-`" = "workspace::ToggleLocalTerminal"
"ctrl-j" = "workspace::ToggleLocalTerminal"
"ctrl-alt-b" = "workspace::ToggleRightPanel"
"ctrl-alt-n" = "workspace::NewWindow"
"ctrl-alt-w" = "workspace::CloseWindow"
"ctrl-shift-f" = "workspace::Find"
"f3" = "workspace::FindNext"
"shift-f3" = "workspace::FindPrevious"
"ctrl-f3" = "workspace::FindNextSelection"

