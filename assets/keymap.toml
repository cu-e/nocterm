# ── Terminal ────────────────────────────────────────────────────────────────

[[section]]
context = "Terminal"
os = ["linux", "windows"]

[section.bindings]
"ctrl-shift-c" = "terminal::Copy"
"ctrl-shift-v" = "terminal::Paste"
"shift-insert" = "terminal::Paste"
"shift-pageup" = "terminal::ScrollPageUp"
"shift-pagedown" = "terminal::ScrollPageDown"
"shift-home" = "terminal::ScrollToTop"
"shift-end" = "terminal::ScrollToBottom"
"ctrl-shift-r" = "terminal::Reconnect"

[[section]]
context = "Terminal"
os = ["macos"]

[section.bindings]
"cmd-c" = "terminal::Copy"
"cmd-v" = "terminal::Paste"
"shift-pageup" = "terminal::ScrollPageUp"
"shift-pagedown" = "terminal::ScrollPageDown"
"cmd-home" = "terminal::ScrollToTop"
"cmd-end" = "terminal::ScrollToBottom"
"cmd-r" = "terminal::Reconnect"

# AI panel controls.
[[section]]
context = "AgentPanel"
os = ["linux", "windows"]
[section.bindings]
"ctrl-alt-m" = "agent::ToggleModelPicker"
"ctrl-n" = "agent::NewThreadWithLastAgent"

[[section]]
context = "AgentPanel"
os = ["macos"]
[section.bindings]
"cmd-alt-m" = "agent::ToggleModelPicker"
"cmd-n" = "agent::NewThreadWithLastAgent"
