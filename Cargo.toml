[package]
name = "nocterm"
description = "A fast, extensible SSH client."
version = "1.4.2"
edition.workspace = true
license-file.workspace = true
publish = false

[package.metadata.nocterm]
layer = "app"

[dependencies]
nocterm-ai.workspace = true
nocterm-acp.workspace = true
nocterm-agent.workspace = true
nocterm-device-unlock.workspace = true
nocterm-connections.workspace = true
nocterm-containers-ui.workspace = true
nocterm-snippets-ui.workspace = true
nocterm-core.workspace = true
nocterm-design.workspace = true
nocterm-files.workspace = true
nocterm-keymap.workspace = true
nocterm-keymap-ui.workspace = true
nocterm-local.workspace = true
nocterm-monitor-ui.workspace = true
nocterm-session.workspace = true
nocterm-settings.workspace = true
nocterm-settings-ui.workspace = true
nocterm-ssh.workspace = true
nocterm-terminal.workspace = true
nocterm-themes.workspace = true
nocterm-vault-ui.workspace = true
nocterm-ui.workspace = true
nocterm-workspace.workspace = true

anyhow.workspace = true
futures.workspace = true
gpui-kit.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

# Linux packages: see docs/PACKAGING.md. Both binaries are built first, then
# `cargo deb --no-build` and `cargo generate-rpm` assemble them.
[package.metadata.deb]
name = "nocterm"
maintainer = "Nocterm contributors"
copyright = "Nocterm contributors"
extended-description = "Nocterm is a fast, extensible SSH client with SFTP, an encrypted credential vault and fingerprint unlock."
section = "net"
priority = "optional"
depends = "$auto, dbus, systemd"
recommends = "fprintd, openssh-client"
maintainer-scripts = "packaging/linux/scripts"
assets = [
    ["target/release/nocterm", "usr/bin/", "755"],
    ["target/release/nocterm-vault-broker", "usr/libexec/nocterm/", "755"],
    ["packaging/linux/nocterm-vault-broker.service", "usr/lib/systemd/system/", "644"],
    ["packaging/linux/dev.nocterm.VaultBroker1.conf", "usr/share/dbus-1/system.d/", "644"],
    ["packaging/linux/dev.nocterm.VaultBroker1.service", "usr/share/dbus-1/system-services/", "644"],
    ["packaging/linux/dev.nocterm.Nocterm.desktop", "usr/share/applications/", "644"],
    ["assets/icons/nocterm.svg", "usr/share/icons/hicolor/scalable/apps/dev.nocterm.Nocterm.svg", "644"],
    ["assets/icons/nocterm-256.png", "usr/share/icons/hicolor/256x256/apps/dev.nocterm.Nocterm.png", "644"],
    ["README.md", "usr/share/doc/nocterm/", "644"],
    ["LICENSE", "usr/share/doc/nocterm/", "644"],
    ["THIRD_PARTY_NOTICES.txt", "usr/share/doc/nocterm/", "644"],
    ["docs/DEVICE_UNLOCK.md", "usr/share/doc/nocterm/", "644"],
]

[package.metadata.generate-rpm]
name = "nocterm"
summary = "A fast, extensible SSH client"
license = "LicenseRef-PolyForm-Perimeter-1.0.1 AND LicenseRef-Nocterm-Third-Party"
post_install_script = "packaging/linux/scripts/postinst"
pre_uninstall_script = "packaging/linux/scripts/prerm"
post_uninstall_script = "packaging/linux/scripts/postrm"
assets = [
    { source = "target/release/nocterm", dest = "/usr/bin/nocterm", mode = "755" },
    { source = "target/release/nocterm-vault-broker", dest = "/usr/libexec/nocterm/nocterm-vault-broker", mode = "755" },
    { source = "packaging/linux/nocterm-vault-broker.service", dest = "/usr/lib/systemd/system/nocterm-vault-broker.service", mode = "644" },
    { source = "packaging/linux/dev.nocterm.VaultBroker1.conf", dest = "/usr/share/dbus-1/system.d/dev.nocterm.VaultBroker1.conf", mode = "644" },
    { source = "packaging/linux/dev.nocterm.VaultBroker1.service", dest = "/usr/share/dbus-1/system-services/dev.nocterm.VaultBroker1.service", mode = "644" },
    { source = "packaging/linux/dev.nocterm.Nocterm.desktop", dest = "/usr/share/applications/dev.nocterm.Nocterm.desktop", mode = "644" },
    { source = "assets/icons/nocterm.svg", dest = "/usr/share/icons/hicolor/scalable/apps/dev.nocterm.Nocterm.svg", mode = "644" },
    { source = "assets/icons/nocterm-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/dev.nocterm.Nocterm.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/nocterm/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/nocterm/LICENSE", mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES.txt", dest = "/usr/share/doc/nocterm/THIRD_PARTY_NOTICES.txt", mode = "644", doc = true },
    { source = "docs/DEVICE_UNLOCK.md", dest = "/usr/share/doc/nocterm/DEVICE_UNLOCK.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
dbus = "*"
systemd = "*"

[package.metadata.generate-rpm.recommends]
fprintd = "*"
openssh-clients = "*"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
gpui-kit = { workspace = true, features = ["test-support"] }

[workspace]
members = ["crates/*", "xtask"]
exclude = ["vendor/alacritty_terminal", "vendor/gpui-component", "vendor/tid-rs"]
resolver = "3"

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
gpui-component = { path = "vendor/gpui-component" }
tid-rs = { path = "vendor/tid-rs" }

[workspace.package]
edition = "2024"
license-file = "LICENSE"

[workspace.dependencies]
nocterm-ai = { path = "crates/ai" }
nocterm-acp = { path = "crates/acp" }
nocterm-agent = { path = "crates/agent" }

# Internal crates. Their versions stay at 0.0.0: only the `nocterm` package is released.
nocterm-device-unlock = { path = "crates/device-unlock" }
nocterm-connections = { path = "crates/connections" }
nocterm-containers = { path = "crates/containers" }
nocterm-containers-ui = { path = "crates/containers-ui" }
nocterm-snippets = { path = "crates/snippets" }
nocterm-snippets-ui = { path = "crates/snippets-ui" }
nocterm-core = { path = "crates/core" }
nocterm-design = { path = "crates/design" }
nocterm-files = { path = "crates/files" }
nocterm-keymap = { path = "crates/keymap" }
nocterm-keymap-ui = { path = "crates/keymap-ui" }
nocterm-local = { path = "crates/local" }
nocterm-monitor = { path = "crates/monitor" }
nocterm-monitor-ui = { path = "crates/monitor-ui" }
nocterm-session = { path = "crates/session" }
nocterm-settings = { path = "crates/settings" }
nocterm-settings-ui = { path = "crates/settings-ui" }
nocterm-ssh = { path = "crates/ssh" }
nocterm-terminal = { path = "crates/terminal" }
nocterm-transfers = { path = "crates/transfers" }
nocterm-themes = { path = "crates/themes" }
nocterm-ui = { path = "crates/ui" }
nocterm-vt = { path = "crates/vt" }
nocterm-workspace = { path = "crates/workspace" }
nocterm-vault = { path = "crates/vault" }
nocterm-vault-ui = { path = "crates/vault-ui" }

agent-client-protocol = "=2.2.0"
agent-client-protocol-schema = { version = "=1.9.1", features = ["unstable_session_fork", "unstable_end_turn_token_usage"] }
base64 = "0.22"
async-io = "2"
async-process = "2"

argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
hmac = "0.13"
sha1 = "0.11"
secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
fs2 = "0.4"
encoding_rs = "0.8"
alacritty_terminal = "0.26"
anyhow = "1"
async-channel = "2"
directories = "6"
futures = "0.3"
gpui-kit = "0.7"
parking_lot = "0.12"
portable-pty = "0.9"
regex = "1"
# Zed's reqwest fork, already in the tree through GPUI.
reqwest = { package = "gpui-pre-reqwest", version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex-syntax = "0.8"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_lenient = "0.2.4"
tar = "0.4"
flate2 = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# GPUI views and delegates routinely exceed the default thresholds.
type_complexity = "allow"
too_many_arguments = "allow"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

# Rendering, text shaping and crypto are unusable unoptimised, even in debug builds.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
alacritty_terminal = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
resvg = { opt-level = 3 }
ring = { opt-level = 3 }
russh = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
vte = { opt-level = 3 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
