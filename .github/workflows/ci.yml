name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate.
        type: string
        required: false
        default: ""
      pr_number:
        description: Release pull request whose title and commits must be checked.
        type: number
        required: false
        default: 0

# A new push to a pull request supersedes its running checks. Master and
# release validation always finish, so every merged commit gets a verdict.
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  release-pipeline:
    name: Release pipeline regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated updater test dependencies
        run: npm install --prefix "$RUNNER_TEMP/release-pipeline-tests" --ignore-scripts --no-audit --no-fund release-please@17.3.0 yaml@2.9.1
      - name: Check release updates and validation wiring
        env:
          NODE_PATH: ${{ runner.temp }}/release-pipeline-tests/node_modules
        run: node scripts/test-release-pipeline.cjs
      - name: Check release notice preparation
        run: python3 scripts/test-prepare-release-pr.py

  conventions:
    name: Conventional Commits
    if: github.event_name == 'pull_request' || inputs.pr_number != 0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Read release pull request
        if: inputs.pr_number != 0
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: ${{ inputs.pr_number || 0 }}
            });
            core.setOutput('title', pr.title);
            core.setOutput('base', pr.base.sha);

      # PRs are squash-merged, so the title becomes the commit on master
      # and is what release-please reads.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ steps.pr.outputs.title || github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          scripts/lint-commit-msg.sh "$RUNNER_TEMP/title"

      - name: Lint commits
        env:
          BASE: ${{ steps.pr.outputs.base || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.ref || github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/lint-commit-msg.sh "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  # Packaging rejects stale notices only after merge; catch the drift here,
  # while the change that caused it is still open.
  notices:
    name: Third-party notices
    # Release pull requests get their notices regenerated by release.yml,
    # which then validates the prepared commit through this workflow.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Check notice inputs
        run: python3 scripts/generate-license-notices.py --check-inputs

  # Manifest-only and fast. --with-metadata is not used: it rewrites Cargo.lock.
  unused-dependencies:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
      - name: Install cargo-machete
        run: cargo install --locked --version 0.9.2 cargo-machete
      - run: cargo machete --skip-target-dir

  rust:
    name: Build, lint, tests and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NOCTERM_REQUIRE_SSHD: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libssl-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers openssh-server openssh-client dbus
          sudo mkdir -p /run/sshd
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/nocterm-workspace-tests.log"
      - name: Report workspace test failures
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "nocterm-workspace-tests.log"
          if log.is_file():
              excerpt = "\n".join(log.read_text(errors="replace").splitlines()[-100:])[-16000:]
              for start in range(0, len(excerpt), 3000):
                  chunk = excerpt[start:start + 3000]
                  escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Workspace test failure::" + escaped)
          PYTHON
      - run: cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml --lib
      - name: Verify native menu patch
        run: cargo test --manifest-path vendor/gpui-component/Cargo.toml --locked --features test-support --lib menu::app_menu_bar
      - run: cargo xtask docs --check
      - run: cargo xtask architecture
      - run: cargo doc --locked --workspace --no-deps

  device-unlock-native:
    name: Device unlock on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile and link native adapters
        run: cargo build --locked -p nocterm-device-unlock --all-targets
      - name: Lint native adapters
        run: cargo clippy --locked -p nocterm-vault -p nocterm-device-unlock --all-targets -- -D warnings
      - name: Test portable envelope and native metadata without authentication prompts
        run: cargo test --locked -p nocterm-vault -p nocterm-device-unlock

  # The one check to require in branch protection: it passes only when every
  # job above passed or was skipped by design, so adding a job never needs a
  # settings change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [release-pipeline, conventions, notices, unused-dependencies, rust, device-unlock-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          failed = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()
                    if job["result"] not in ("success", "skipped")}
          for name, result in failed.items():
              print(f"::error title=CI job {name}::{name} finished as {result}")
          raise SystemExit(1 if failed else 0)
          PYTHON
