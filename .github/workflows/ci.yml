name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PRs are squash-merged, so the title becomes the commit on master
      # and is what release-please reads.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          scripts/lint-commit-msg.sh "$RUNNER_TEMP/title"

      - name: Lint commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/lint-commit-msg.sh "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  rust:
    name: Build, lint, tests and documentation
    runs-on: ubuntu-latest
    env:
      NOCTERM_REQUIRE_SSHD: "1"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libssl-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libvulkan-dev mesa-vulkan-drivers openssh-server openssh-client dbus
          sudo mkdir -p /run/sshd
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace tests
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee "$RUNNER_TEMP/nocterm-workspace-tests.log"
      - name: Report workspace test failures
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "nocterm-workspace-tests.log"
          if log.is_file():
              excerpt = "\n".join(log.read_text(errors="replace").splitlines()[-100:])[-16000:]
              escaped = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Workspace test failure::" + escaped)
          PYTHON
      - run: cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml --lib
      - name: Verify native menu patch
        run: cargo test --manifest-path vendor/gpui-component/Cargo.toml --locked --features test-support --lib menu::app_menu_bar
      - run: cargo xtask docs --check
      - run: cargo xtask architecture
      - run: cargo doc --locked --workspace --no-deps

  device-unlock-native:
    name: Device unlock on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Compile and link native adapters
        run: cargo build --locked -p nocterm-device-unlock --all-targets
      - name: Lint native adapters
        run: cargo clippy --locked -p nocterm-vault -p nocterm-device-unlock --all-targets -- -D warnings
      - name: Test portable envelope and native metadata without authentication prompts
        run: cargo test --locked -p nocterm-vault -p nocterm-device-unlock
