name: Diagnose CI
on:
  push:
    branches: [master]
permissions:
  actions: read
jobs:
  failure-details:
    runs-on: ubuntu-latest
    steps:
      - name: Read previous failed test log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cu-e/nocterm/actions/jobs/111485479622/logs \
            -o "$RUNNER_TEMP/failed-tests.log"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          text = (Path(os.environ["RUNNER_TEMP"]) / "failed-tests.log").read_text(errors="replace")
          lines = text.splitlines()
          indices = [i for i, line in enumerate(lines) if "panicked at" in line or "failures:" in line]
          excerpt = "\n".join(lines[max(0, indices[0] - 2):indices[0] + 45]) if indices else "\n".join(lines[-100:])
          for start in range(0, len(excerpt), 3000):
              chunk = excerpt[start:start + 3000]
              escaped = chunk.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Previous CI failure details::" + escaped)
          PYTHON
